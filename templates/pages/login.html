{% extends 'base.html' %}

{% block content %}

<form method="POST" action="{% url 'login' %}">
    <br>
    <br>
    {% csrf_token %}
    <input type="text" name="username" placeholder="Enter your username">
    <br>
    <input type="password" name="password" placeholder="Enter your password">
    <br>
    <button type="submit">Submit</button>
</form>


{% endblock content %}
